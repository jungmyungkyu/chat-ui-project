<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Earnings Call PoC UI</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; max-width: 900px; }
      textarea, input { width: 100%; margin: 6px 0 12px; padding: 8px; }
      textarea { min-height: 120px; }
      button { padding: 10px 16px; cursor: pointer; }
      pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
  </head>
  <body>
    <h1>LLM 어닝콜 PoC 테스트 UI</h1>
    <p>실모드(OpenAI API) 또는 Mock 모드로 엔드투엔드 테스트가 가능합니다.</p>

    <label>Transcript (영문)</label>
    <textarea id="transcript">Company reported quarterly revenue of $5.4B, up 8% YoY...</textarea>

    <label>Previous Summary</label>
    <textarea id="previous">Previous quarter revenue was $5.1B with 39.8% gross margin...</textarea>

    <label>Portfolio JSON</label>
    <textarea id="portfolio">[{"name":"AAPL","weight":0.4},{"name":"MSFT","weight":0.6}]</textarea>

    <label><input type="checkbox" id="use_mock" checked /> Mock 모드(use_mock)</label>
    <br/><br/>
    <button onclick="runAnalyze()">분석 실행</button>

    <h2>결과</h2>
    <pre id="result">아직 실행 전</pre>

    <script>
      async function runAnalyze() {
        const transcript = document.getElementById('transcript').value;
        const previous_summary = document.getElementById('previous').value;
        const use_mock = document.getElementById('use_mock').checked;
        let portfolio;
        try {
          portfolio = JSON.parse(document.getElementById('portfolio').value);
        } catch (e) {
          alert('Portfolio JSON 형식이 잘못되었습니다.');
          return;
        }

        const res = await fetch('/analyze', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ transcript, previous_summary, portfolio, use_mock })
        });

        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
      }
    </script>
  </body>
</html>
